<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>YTAmbience</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>YTAmbience</h1>
    <label class="switch" title="Turn the glow on or off">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <main id="controls">
    <label class="row">
      <span>Intensity <output for="intensity"></output></span>
      <input type="range" id="intensity" min="0.1" max="1" step="0.05" data-format="percent" />
    </label>
    <label class="row">
      <span>Blur <output for="blur"></output></span>
      <input type="range" id="blur" min="10" max="150" step="5" data-format="px" />
    </label>
    <label class="row">
      <span>Spread <output for="spread"></output></span>
      <input type="range" id="spread" min="0.05" max="0.5" step="0.01" data-format="percent" />
    </label>
    <label class="row">
      <span>Saturation <output for="saturation"></output></span>
      <input type="range" id="saturation" min="0.5" max="3" step="0.1" data-format="x" />
    </label>
    <label class="row">
      <span>Smoothness <output for="smoothness"></output></span>
      <input type="range" id="smoothness" min="0" max="0.95" step="0.05" data-format="percent" />
    </label>
    <label class="row">
      <span>Refresh rate <output for="fps"></output></span>
      <input type="range" id="fps" min="5" max="60" step="5" data-format="fps" />
    </label>
    <label class="check">
      <input type="checkbox" id="hideNative" />
      <span>Hide YouTube's built-in Ambient mode</span>
    </label>
  </main>

  <footer>
    <button id="reset" type="button">Reset to defaults</button>
  </footer>

  <script src="../src/defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
